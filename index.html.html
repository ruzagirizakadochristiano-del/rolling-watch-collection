<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROLLING WATCH COLLECTION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-50">

<nav class="bg-black text-white px-6 py-4 flex justify-between items-center shadow-lg sticky top-0 z-30">
    <div class="text-2xl font-bold"><i class="fas fa-clock mr-2"></i>ROLLING WATCH COLLECTION</div>
    <div class="flex gap-4 items-center">
        <button id="homeNavBtn" class="hover:text-amber-400">Home</button>
        <button id="userPanelNavBtn" class="hover:text-amber-400 hidden">My Panel</button>
        <button id="adminPanelNavBtn" class="hover:text-amber-400 hidden">Admin</button>
        <button id="cartIconBtn" class="relative"><i class="fas fa-shopping-cart text-xl"></i><span id="cartCount" class="absolute -top-2 -right-3 bg-red-500 text-xs rounded-full px-1.5">0</span></button>
        <button id="registerBtn" class="bg-amber-600 px-3 py-1 rounded-full text-sm">Register</button>
        <button id="loginBtn" class="border border-amber-500 px-3 py-1 rounded-full text-sm">Login</button>
        <button id="logoutBtn" class="hidden bg-gray-700 px-3 py-1 rounded-full text-sm">Logout</button>
    </div>
</nav>

<!-- Home -->
<section id="home-section" class="max-w-7xl mx-auto px-4 py-10">
    <div class="text-center mb-10"><h1 class="text-4xl font-bold">Timeless Elegance</h1><p class="text-gray-600">Discover our premium watch collection</p></div>
    <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
</section>

<!-- User Panel -->
<section id="user-panel-section" class="max-w-4xl mx-auto px-4 py-10 hidden">
    <div class="bg-white rounded-2xl shadow-xl p-6">
        <h2 class="text-2xl font-bold border-b pb-2 mb-4"><i class="fas fa-id-card mr-2"></i>My Dashboard</h2>
        <div id="userInfoDisplay"></div>
        <div class="mt-6 bg-gray-50 p-4 rounded-xl">
            <h3 class="font-semibold text-lg">📧 Contact & Social</h3>
            <p>Official Contact Email: <span id="contactEmailSpan" class="font-mono text-blue-700"></span></p>
            <div id="socialLinksContainer" class="flex gap-4 mt-2"></div>
        </div>
    </div>
</section>

<!-- Admin Panel -->
<section id="admin-panel-section" class="max-w-6xl mx-auto px-4 py-8 hidden">
    <div class="bg-white rounded-2xl shadow-xl p-6 mb-8">
        <h2 class="text-2xl font-bold">🛠️ Product Management</h2>
        <form id="productForm" class="grid md:grid-cols-2 gap-4 mt-4">
            <input type="text" id="productName" placeholder="Watch name" class="border p-2 rounded" required>
            <input type="number" step="0.01" id="productPrice" placeholder="Price (USD)" class="border p-2 rounded" required>
            <textarea id="productDesc" placeholder="Description" class="border p-2 rounded md:col-span-2"></textarea>
            <input type="file" id="productImage" accept="image/*" class="border p-1 rounded">
            <div class="md:col-span-2 flex gap-2">
                <button type="submit" class="bg-green-700 text-white px-4 py-2 rounded"><span id="productFormTitle">➕ Add New Watch</span></button>
                <button type="button" id="cancelEdit" class="bg-gray-500 text-white px-4 py-2 rounded hidden">Cancel Edit</button>
            </div>
        </form>
        <div class="mt-8"><h3 class="font-bold text-xl">📋 Inventory</h3><div id="productListAdmin"></div></div>
    </div>
    <div class="grid md:grid-cols-2 gap-6">
        <div class="bg-white p-5 rounded-2xl shadow"><h3 class="text-xl font-bold mb-3">👥 Registered Users</h3><div class="overflow-auto max-h-72"><table id="userListAdmin" class="w-full text-sm"></table></div></div>
        <div id="performanceStats" class="bg-white p-5 rounded-2xl shadow"></div>
    </div>
</section>

<!-- Cart Sidebar -->
<div id="cartOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden"></div>
<div id="cartSidebar" class="fixed top-0 right-0 w-96 h-full bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
    <div class="flex justify-between p-4 border-b"><h2 class="text-xl font-bold">Your Cart</h2><button id="closeCart" class="text-2xl">&times;</button></div>
    <div id="cartItems" class="flex-1 overflow-y-auto p-4"></div>
    <div class="border-t p-4"><div class="flex justify-between text-xl font-bold">Total: $<span id="cartTotal">0.00</span></div><button class="w-full bg-black text-white py-2 mt-3 rounded-full">Checkout (Demo)</button></div>
</div>

<!-- Modals -->
<div id="registerModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 relative"><button id="closeRegModal" class="absolute top-3 right-4 text-2xl">&times;</button><h3 class="text-2xl font-bold mb-4">Create Account</h3><form id="regForm"><input type="text" id="regFirstName" placeholder="First Name" class="w-full border p-2 mb-3 rounded" required><input type="text" id="regLastName" placeholder="Last Name" class="w-full border p-2 mb-3 rounded" required><input type="email" id="regEmail" placeholder="Email" class="w-full border p-2 mb-3 rounded" required><input type="password" id="regPassword" placeholder="Password" class="w-full border p-2 mb-3 rounded" required><input type="password" id="regConfirmPassword" placeholder="Confirm Password" class="w-full border p-2 mb-4 rounded" required><button type="submit" class="w-full bg-black text-white py-2 rounded-full">Register</button></form></div>
</div>
<div id="loginModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 relative"><button id="closeLoginModal" class="absolute top-3 right-4 text-2xl">&times;</button><h3 class="text-2xl font-bold mb-4">Welcome Back</h3><form id="loginForm"><input type="email" id="loginEmail" placeholder="Email" class="w-full border p-2 mb-3 rounded" required><input type="password" id="loginPassword" placeholder="Password" class="w-full border p-2 mb-4 rounded" required><button type="submit" class="w-full bg-black text-white py-2 rounded-full">Login</button><p class="text-xs text-center mt-3">Admin: admin@rollingwatch.com</p></form></div>
</div>

<script type="module">
    // 🔥 YOUR FIREBASE CONFIG (replace with your actual one)
    const firebaseConfig = {
        apiKey: "AIzaSyDzXbIPi6QdN1MjK3t1N_m4BVfEEoI_SGY",
        authDomain: "rolling-watch-collection.firebaseapp.com",
        projectId: "rolling-watch-collection",
        storageBucket: "rolling-watch-collection.firebasestorage.app",
        messagingSenderId: "780300275683",
        appId: "1:780300275683:web:05a06771ac53c744e3dad6"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDocs, getDoc, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // DOM elements
    const homeSection = document.getElementById('home-section');
    const userPanelSection = document.getElementById('user-panel-section');
    const adminPanelSection = document.getElementById('admin-panel-section');
    const registerBtn = document.getElementById('registerBtn');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userPanelNavBtn = document.getElementById('userPanelNavBtn');
    const adminPanelNavBtn = document.getElementById('adminPanelNavBtn');
    const homeNavBtn = document.getElementById('homeNavBtn');
    const cartIconBtn = document.getElementById('cartIconBtn');
    const cartSidebar = document.getElementById('cartSidebar');
    const closeCart = document.getElementById('closeCart');
    const cartOverlay = document.getElementById('cartOverlay');
    const cartItemsContainer = document.getElementById('cartItems');
    const cartTotalSpan = document.getElementById('cartTotal');
    const cartCountSpan = document.getElementById('cartCount');
    const registerModal = document.getElementById('registerModal');
    const loginModal = document.getElementById('loginModal');
    const closeReg = document.getElementById('closeRegModal');
    const closeLogin = document.getElementById('closeLoginModal');
    const regForm = document.getElementById('regForm');
    const loginForm = document.getElementById('loginForm');
    const productForm = document.getElementById('productForm');
    const productListAdmin = document.getElementById('productListAdmin');
    const userListAdmin = document.getElementById('userListAdmin');
    const performanceStats = document.getElementById('performanceStats');
    const cancelEditBtn = document.getElementById('cancelEdit');
    const userInfoDisplay = document.getElementById('userInfoDisplay');
    const contactEmailSpan = document.getElementById('contactEmailSpan');
    const socialLinksContainer = document.getElementById('socialLinksContainer');

    let currentUser = null;
    let currentUserRole = 'guest';
    let products = [];
    let cart = [];
    let editingProductId = null;

    // Cart functions
    function saveCart() {
        localStorage.setItem('rollingWatchCart', JSON.stringify(cart));
        updateCartUI();
    }
    function loadCart() {
        const saved = localStorage.getItem('rollingWatchCart');
        cart = saved ? JSON.parse(saved) : [];
        updateCartUI();
    }
    function updateCartUI() {
        let total = 0;
        let count = 0;
        cartItemsContainer.innerHTML = '';
        if (cart.length === 0) {
            cartItemsContainer.innerHTML = '<div class="text-gray-500 text-center py-6">Cart is empty</div>';
        } else {
            cart.forEach((item, idx) => {
                total += item.price * item.quantity;
                count += item.quantity;
                const div = document.createElement('div');
                div.className = 'flex gap-3 border-b pb-3 mb-3';
                div.innerHTML = `
                    <img src="${item.imageUrl || 'https://via.placeholder.com/60'}" class="w-16 h-16 object-cover rounded">
                    <div class="flex-1">
                        <h4 class="font-semibold">${item.name}</h4>
                        <p>$${item.price}</p>
                        <div class="flex gap-2 mt-1">
                            <button class="cart-qty-dec bg-gray-200 px-2 rounded" data-idx="${idx}">-</button>
                            <span>${item.quantity}</span>
                            <button class="cart-qty-inc bg-gray-200 px-2 rounded" data-idx="${idx}">+</button>
                            <button class="cart-remove text-red-500" data-idx="${idx}">🗑️</button>
                        </div>
                    </div>
                    <div>$${(item.price * item.quantity).toFixed(2)}</div>
                `;
                cartItemsContainer.appendChild(div);
            });
        }
        cartTotalSpan.innerText = total.toFixed(2);
        cartCountSpan.innerText = count;
        // Attach events
        document.querySelectorAll('.cart-qty-dec').forEach(btn => {
            btn.addEventListener('click', () => {
                const i = parseInt(btn.dataset.idx);
                if (cart[i].quantity > 1) cart[i].quantity--;
                else cart.splice(i, 1);
                saveCart();
                renderHomeProducts();
            });
        });
        document.querySelectorAll('.cart-qty-inc').forEach(btn => {
            btn.addEventListener('click', () => {
                const i = parseInt(btn.dataset.idx);
                cart[i].quantity++;
                saveCart();
                renderHomeProducts();
            });
        });
        document.querySelectorAll('.cart-remove').forEach(btn => {
            btn.addEventListener('click', () => {
                const i = parseInt(btn.dataset.idx);
                cart.splice(i, 1);
                saveCart();
                renderHomeProducts();
            });
        });
    }
    function addToCart(product) {
        const existing = cart.find(i => i.id === product.id);
        if (existing) existing.quantity++;
        else cart.push({ ...product, quantity: 1 });
        saveCart();
        alert(`${product.name} added to cart!`);
    }

    // Products
    async function fetchProducts() {
        const querySnapshot = await getDocs(collection(db, "products"));
        products = [];
        querySnapshot.forEach(docSnap => {
            products.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderHomeProducts();
        if (currentUserRole === 'admin') await renderAdminProductList();
        if (currentUserRole === 'admin') await loadAllUsers();
    }
    function renderHomeProducts() {
        const grid = document.getElementById('productsGrid');
        if (products.length === 0) {
            grid.innerHTML = '<div class="col-span-full text-center py-10">No products yet</div>';
            return;
        }
        grid.innerHTML = products.map(p => `
            <div class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition">
                <img src="${p.imageUrl || 'https://via.placeholder.com/300x200?text=Watch'}" class="h-48 w-full object-cover">
                <div class="p-4">
                    <h3 class="font-bold text-lg">${p.name}</h3>
                    <p class="text-gray-600 text-sm truncate">${p.description || ''}</p>
                    <div class="flex justify-between items-center mt-3">
                        <span class="text-xl font-bold text-amber-700">$${p.price}</span>
                        <button class="add-to-cart-home bg-black text-white px-3 py-1.5 rounded-full text-sm" data-id="${p.id}"><i class="fas fa-shopping-cart mr-1"></i> Add</button>
                    </div>
                </div>
            </div>
        `).join('');
        document.querySelectorAll('.add-to-cart-home').forEach(btn => {
            btn.addEventListener('click', () => {
                const prod = products.find(p => p.id === btn.dataset.id);
                if (prod) addToCart(prod);
            });
        });
    }
    async function renderAdminProductList() {
        if (!productListAdmin) return;
        if (products.length === 0) {
            productListAdmin.innerHTML = '<div class="text-gray-500">No products yet. Add one above.</div>';
            return;
        }
        productListAdmin.innerHTML = products.map(p => `
            <div class="flex justify-between items-center border-b pb-2 mb-2">
                <div class="flex items-center gap-3">
                    <img src="${p.imageUrl || 'https://via.placeholder.com/40'}" class="w-10 h-10 object-cover rounded">
                    <div><strong>${p.name}</strong><br><span class="text-sm">$${p.price}</span><br><span class="text-xs text-gray-500">${p.description?.substring(0, 30)}</span></div>
                </div>
                <div>
                    <button class="edit-product-btn bg-blue-600 text-white px-2 py-1 rounded text-sm mr-1" data-id="${p.id}"><i class="fas fa-edit"></i> Edit</button>
                    <button class="delete-product-btn bg-red-600 text-white px-2 py-1 rounded text-sm" data-id="${p.id}"><i class="fas fa-trash"></i> Del</button>
                </div>
            </div>
        `).join('');
        document.querySelectorAll('.edit-product-btn').forEach(btn => {
            btn.addEventListener('click', () => openEditProduct(btn.dataset.id));
        });
        document.querySelectorAll('.delete-product-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                if (confirm('Delete product?')) {
                    await deleteProduct(btn.dataset.id);
                }
            });
        });
    }
    async function deleteProduct(productId) {
        const productRef = doc(db, "products", productId);
        const productSnap = await getDoc(productRef);
        if (productSnap.exists() && productSnap.data().imageUrl) {
            const oldUrl = productSnap.data().imageUrl;
            const oldPath = oldUrl.split('/o/')[1]?.split('?')[0];
            if (oldPath) {
                try {
                    await deleteObject(ref(storage, decodeURIComponent(oldPath)));
                } catch (e) { }
            }
        }
        await deleteDoc(productRef);
        await fetchProducts();
        if (currentUserRole === 'admin') await loadAllUsers();
    }
    async function openEditProduct(id) {
        const prod = products.find(p => p.id === id);
        if (!prod) return;
        editingProductId = id;
        document.getElementById('productName').value = prod.name;
        document.getElementById('productDesc').value = prod.description || '';
        document.getElementById('productPrice').value = prod.price;
        document.getElementById('productImage').value = '';
        document.getElementById('productFormTitle').innerText = '✏️ Edit Product';
        cancelEditBtn.classList.remove('hidden');
    }
    function resetProductForm() {
        editingProductId = null;
        document.getElementById('productForm').reset();
        document.getElementById('productFormTitle').innerText = '➕ Add New Watch';
        cancelEditBtn.classList.add('hidden');
    }
    productForm.onsubmit = async (e) => {
        e.preventDefault();
        const name = document.getElementById('productName').value.trim();
        const desc = document.getElementById('productDesc').value.trim();
        const price = parseFloat(document.getElementById('productPrice').value);
        const imageFile = document.getElementById('productImage').files[0];
        if (!name || isNaN(price)) {
            alert("Name and valid price required");
            return;
        }
        try {
            let imageUrl = null;
            if (editingProductId) {
                const existingRef = doc(db, "products", editingProductId);
                const snap = await getDoc(existingRef);
                const existingData = snap.data();
                if (imageFile) {
                    if (existingData.imageUrl) {
                        const oldPath = existingData.imageUrl.split('/o/')[1]?.split('?')[0];
                        if (oldPath) {
                            try {
                                await deleteObject(ref(storage, decodeURIComponent(oldPath)));
                            } catch (e) { }
                        }
                    }
                    const storageRef = ref(storage, `products/${Date.now()}_${imageFile.name}`);
                    await uploadBytes(storageRef, imageFile);
                    imageUrl = await getDownloadURL(storageRef);
                } else {
                    imageUrl = existingData.imageUrl;
                }
                await updateDoc(existingRef, { name, description: desc, price, imageUrl });
            } else {
                if (!imageFile) {
                    alert("Please select an image for new product");
                    return;
                }
                const storageRef = ref(storage, `products/${Date.now()}_${imageFile.name}`);
                await uploadBytes(storageRef, imageFile);
                imageUrl = await getDownloadURL(storageRef);
                await addDoc(collection(db, "products"), { name, description: desc, price, imageUrl, createdAt: new Date() });
            }
            resetProductForm();
            await fetchProducts();
            if (currentUserRole === 'admin') await loadAllUsers();
        } catch (err) {
            alert("Error saving product: " + err.message);
        }
    };
    cancelEditBtn.onclick = resetProductForm;

    // Users & performance
    async function loadAllUsers() {
        if (!userListAdmin) return;
        const usersSnap = await getDocs(collection(db, "users"));
        let html = `<tr class="bg-gray-100"><th>Name</th><th>Email</th><th>Role</th></tr>`;
        usersSnap.forEach(docUser => {
            const data = docUser.data();
            html += `<tr class="border-b"><td class="py-1">${data.firstName || ''} ${data.lastName || ''}</td><td>${data.email}</td><td>${data.role || 'user'}</tr>`;
        });
        userListAdmin.innerHTML = html;
        if (performanceStats) {
            performanceStats.innerHTML = `<div class="bg-white p-4 rounded-lg shadow"><p class="text-lg font-bold">📊 Site Performance</p><p>👥 Registered Users: ${usersSnap.size}</p><p>⌚ Total Products: ${products.length}</p><p>🛒 Active Cart Items (local): ${cart.reduce((acc, i) => acc + i.quantity, 0)}</p></div>`;
        }
    }

    // Auth
    async function registerUser(email, password, firstName, lastName) {
        const userCred = await createUserWithEmailAndPassword(auth, email, password);
        const uid = userCred.user.uid;
        let role = 'user';
        if (email === 'admin@rollingwatch.com') role = 'admin';
        await setDoc(doc(db, "users", uid), { firstName, lastName, email, role, createdAt: new Date() });
        alert("Registration successful! You are now logged in.");
        closeModal(registerModal);
    }
    async function loginUser(email, password) {
        await signInWithEmailAndPassword(auth, email, password);
        closeModal(loginModal);
    }
    function logoutUser() {
        signOut(auth);
    }

    // Navigation
    function showHome() {
        homeSection.classList.remove('hidden');
        userPanelSection.classList.add('hidden');
        adminPanelSection.classList.add('hidden');
        fetchProducts();
    }
    function showUserPanel() {
        if (!currentUser) {
            alert("Please login first");
            return;
        }
        homeSection.classList.add('hidden');
        adminPanelSection.classList.add('hidden');
        userPanelSection.classList.remove('hidden');
        loadUserPanelData();
    }
    function showAdminPanel() {
        if (currentUserRole !== 'admin') {
            alert("Access denied: admin only");
            return;
        }
        homeSection.classList.add('hidden');
        userPanelSection.classList.add('hidden');
        adminPanelSection.classList.remove('hidden');
        fetchProducts();
        loadAllUsers();
    }
    async function loadUserPanelData() {
        if (!currentUser) return;
        const userDoc = await getDoc(doc(db, "users", currentUser.uid));
        if (userDoc.exists()) {
            const data = userDoc.data();
            userInfoDisplay.innerHTML = `<div class="bg-white p-5 rounded-xl shadow"><p><strong>${data.firstName} ${data.lastName}</strong></p><p class="text-gray-600">${data.email}</p><p class="text-sm mt-1">Role: ${data.role || 'user'}</p></div>`;
            contactEmailSpan.innerText = data.email;
        } else {
            userInfoDisplay.innerHTML = "<p>Profile incomplete</p>";
            contactEmailSpan.innerText = currentUser.email;
        }
    }
    function updateNavByAuth() {
        const isLogged = !!currentUser;
        registerBtn.classList.toggle('hidden', isLogged);
        loginBtn.classList.toggle('hidden', isLogged);
        logoutBtn.classList.toggle('hidden', !isLogged);
        userPanelNavBtn.classList.toggle('hidden', !isLogged);
        const isAdmin = (currentUserRole === 'admin');
        adminPanelNavBtn.classList.toggle('hidden', !isAdmin);
    }

    // Auth state
    onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        if (user) {
            const userDocRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userDocRef);
            if (userSnap.exists()) currentUserRole = userSnap.data().role;
            else if (user.email === 'admin@rollingwatch.com') currentUserRole = 'admin';
            else currentUserRole = 'user';
        } else {
            currentUserRole = 'guest';
        }
        updateNavByAuth();
        if (currentUserRole === 'admin') adminPanelNavBtn.classList.remove('hidden');
        else adminPanelNavBtn.classList.add('hidden');
        if (currentUser && !userPanelSection.classList.contains('hidden')) loadUserPanelData();
    });

    // Event listeners
    homeNavBtn.onclick = showHome;
    userPanelNavBtn.onclick = showUserPanel;
    adminPanelNavBtn.onclick = showAdminPanel;
    registerBtn.onclick = () => openModal(registerModal);
    loginBtn.onclick = () => openModal(loginModal);
    logoutBtn.onclick = logoutUser;
    closeReg.onclick = () => closeModal(registerModal);
    closeLogin.onclick = () => closeModal(loginModal);
    cartIconBtn.onclick = () => {
        cartSidebar.classList.remove('translate-x-full');
        cartOverlay.classList.remove('hidden');
    };
    closeCart.onclick = () => {
        cartSidebar.classList.add('translate-x-full');
        cartOverlay.classList.add('hidden');
    };
    cartOverlay.onclick = () => {
        cartSidebar.classList.add('translate-x-full');
        cartOverlay.classList.add('hidden');
    };
    regForm.onsubmit = (e) => {
        e.preventDefault();
        const pwd = document.getElementById('regPassword').value;
        const cpwd = document.getElementById('regConfirmPassword').value;
        if (pwd !== cpwd) {
            alert("Passwords do not match");
            return;
        }
        registerUser(
            document.getElementById('regEmail').value,
            pwd,
            document.getElementById('regFirstName').value,
            document.getElementById('regLastName').value
        );
    };
    loginForm.onsubmit = (e) => {
        e.preventDefault();
        loginUser(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value)
            .catch(err => alert(err.message));
    };
    function openModal(modal) { modal.classList.remove('hidden'); }
    function closeModal(modal) { modal.classList.add('hidden'); }

    // Social links
    socialLinksContainer.innerHTML = `
        <a href="https://facebook.com/rollingwatch" target="_blank" class="text-blue-700 text-2xl"><i class="fab fa-facebook"></i></a>
