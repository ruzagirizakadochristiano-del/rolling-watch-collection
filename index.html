<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROLLING WATCH COLLECTION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .notification { position: fixed; top: 85px; right: 20px; z-index: 10000; min-width: 260px; max-width: 360px; padding: 12px 18px; border-radius: 12px; background: white; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2); transform: translateX(120%); transition: transform 0.25s ease-out; font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 12px; border-left: 5px solid; }
        .notification.show { transform: translateX(0); }
        .notification-success { border-left-color: #10b981; background: #ecfdf5; color: #065f46; }
        .notification-error { border-left-color: #ef4444; background: #fef2f2; color: #991b1b; }
        .notification-warning { border-left-color: #f59e0b; background: #fffbeb; color: #92400e; }
        .loader-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:10001; display:flex; justify-content:center; align-items:center; visibility:hidden; opacity:0; transition:all 0.2s; }
        .loader-overlay.active { visibility:visible; opacity:1; }
        .spinner { width:50px; height:50px; border:4px solid rgba(255,255,255,0.3); border-top:4px solid #f59e0b; border-radius:50%; animation:spin 0.8s linear infinite; background:rgba(0,0,0,0.6); }
        @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
        button:disabled { opacity:0.6; cursor:not-allowed; }
    </style>
</head>
<body class="bg-gray-50">

<div id="notificationContainer"></div>
<div id="globalLoader" class="loader-overlay"><div class="spinner"></div></div>

<nav class="bg-black text-white px-6 py-4 flex justify-between items-center shadow-lg sticky top-0 z-30">
    <div class="text-2xl font-bold"><i class="fas fa-clock mr-2"></i>ROLLING WATCH COLLECTION</div>
    <div class="flex gap-4 items-center">
        <button id="homeNavBtn" class="hover:text-amber-400 transition">Home</button>
        <button id="userPanelNavBtn" class="hover:text-amber-400 hidden transition">My Panel</button>
        <button id="adminPanelNavBtn" class="hover:text-amber-400 hidden transition">Admin</button>
        <button id="cartIconBtn" class="relative hover:text-amber-400 transition"><i class="fas fa-shopping-cart text-xl"></i><span id="cartCount" class="absolute -top-2 -right-3 bg-red-500 text-white text-xs rounded-full px-1.5 min-w-[20px] text-center">0</span></button>
        <button id="registerBtn" class="bg-amber-600 px-3 py-1 rounded-full text-sm hover:bg-amber-700 transition">Register</button>
        <button id="loginBtn" class="border border-amber-500 px-3 py-1 rounded-full text-sm hover:bg-amber-700 transition">Login</button>
        <button id="logoutBtn" class="hidden bg-gray-700 px-3 py-1 rounded-full text-sm hover:bg-gray-600 transition">Logout</button>
    </div>
</nav>

<!-- Home -->
<section id="home-section" class="max-w-7xl mx-auto px-4 py-10">
    <div class="text-center mb-10"><h1 class="text-4xl font-bold">Timeless Elegance</h1><p class="text-gray-600">Discover our premium watch collection</p></div>
    <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
</section>

<!-- User Panel -->
<section id="user-panel-section" class="max-w-4xl mx-auto px-4 py-10 hidden">
    <div class="bg-white rounded-2xl shadow-xl p-6">
        <h2 class="text-2xl font-bold border-b pb-2 mb-4"><i class="fas fa-id-card mr-2"></i>My Dashboard</h2>
        <div id="userInfoDisplay"></div>
        <div class="mt-6 bg-gray-50 p-4 rounded-xl">
            <h3 class="font-semibold text-lg">📧 Contact & Social</h3>
            <p>Official Contact Email: <span id="contactEmailSpan" class="font-mono text-blue-700"></span></p>
            <div id="socialLinksContainer" class="flex gap-4 mt-2"></div>
        </div>
    </div>
</section>

<!-- Admin Panel -->
<section id="admin-panel-section" class="max-w-6xl mx-auto px-4 py-8 hidden">
    <div class="bg-white rounded-2xl shadow-xl p-6 mb-8">
        <h2 class="text-2xl font-bold">🛠️ Product Management</h2>
        <form id="productForm" class="grid md:grid-cols-2 gap-4 mt-4">
            <input type="text" id="productName" placeholder="Watch name" class="border p-2 rounded" required>
            <input type="number" step="0.01" id="productPrice" placeholder="Price (USD)" class="border p-2 rounded" required>
            <textarea id="productDesc" placeholder="Description" class="border p-2 rounded md:col-span-2"></textarea>
            <input type="file" id="productImage" accept="image/*" class="border p-1 rounded">
            <div class="md:col-span-2 flex gap-2">
                <button type="submit" id="submitProductBtn" class="bg-green-700 text-white px-4 py-2 rounded hover:bg-green-800 transition"><span id="productFormTitle">➕ Add New Watch</span></button>
                <button type="button" id="cancelEdit" class="bg-gray-500 text-white px-4 py-2 rounded hidden hover:bg-gray-600 transition">Cancel Edit</button>
            </div>
        </form>
        <div class="mt-8"><h3 class="font-bold text-xl">📋 Inventory</h3><div id="productListAdmin"></div></div>
    </div>
    <div class="grid md:grid-cols-2 gap-6">
        <div class="bg-white p-5 rounded-2xl shadow"><h3 class="text-xl font-bold mb-3">👥 Registered Users</h3><div class="overflow-auto max-h-72"><table id="userListAdmin" class="w-full text-sm"></table></div></div>
        <div id="performanceStats" class="bg-white p-5 rounded-2xl shadow"></div>
    </div>
</section>

<!-- Cart Sidebar -->
<div id="cartOverlay" class="fixed inset-0 bg-black bg-opacity-40 z-40 hidden transition"></div>
<div id="cartSidebar" class="fixed top-0 right-0 w-96 h-full bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
    <div class="flex justify-between p-4 border-b"><h2 class="text-xl font-bold">Your Cart</h2><button id="closeCart" class="text-2xl hover:text-red-600">&times;</button></div>
    <div id="cartItems" class="flex-1 overflow-y-auto p-4"></div>
    <div class="border-t p-4"><div class="flex justify-between text-xl font-bold">Total: $<span id="cartTotal">0.00</span></div><button class="w-full bg-black text-white py-2 mt-3 rounded-full hover:bg-gray-800">Checkout (Demo)</button></div>
</div>

<!-- Modals -->
<div id="registerModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 relative"><button id="closeRegModal" class="absolute top-3 right-4 text-2xl hover:text-gray-600">&times;</button><h3 class="text-2xl font-bold mb-4">Create Account</h3><form id="regForm"><input type="text" id="regFirstName" placeholder="First Name" class="w-full border p-2 mb-3 rounded" required><input type="text" id="regLastName" placeholder="Last Name" class="w-full border p-2 mb-3 rounded" required><input type="email" id="regEmail" placeholder="Email" class="w-full border p-2 mb-3 rounded" required><input type="password" id="regPassword" placeholder="Password (min 6 chars)" class="w-full border p-2 mb-3 rounded" required><input type="password" id="regConfirmPassword" placeholder="Confirm Password" class="w-full border p-2 mb-4 rounded" required><button type="submit" class="w-full bg-black text-white py-2 rounded-full hover:bg-gray-800">Register</button></form></div>
</div>
<div id="loginModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 relative"><button id="closeLoginModal" class="absolute top-3 right-4 text-2xl hover:text-gray-600">&times;</button><h3 class="text-2xl font-bold mb-4">Welcome Back</h3><form id="loginForm"><input type="email" id="loginEmail" placeholder="Email" class="w-full border p-2 mb-3 rounded" required><input type="password" id="loginPassword" placeholder="Password" class="w-full border p-2 mb-4 rounded" required><button type="submit" class="w-full bg-black text-white py-2 rounded-full hover:bg-gray-800">Login</button><p class="text-xs text-center mt-3">Admin: admin@rollingwatch.com</p></form></div>
</div>

<script type="module">
    // 🔥 PASTE YOUR REAL FIREBASE CONFIG HERE (from Firebase Console)
    const firebaseConfig = {
        apiKey: "AIzaSyDZxBIpI6QdN1MjK3t1N_m4BVfEEoI_SGY",   // <-- REPLACE WITH REAL KEY
        authDomain: "rolling-watch-collection.firebaseapp.com",
        projectId: "rolling-watch-collection",
        storageBucket: "rolling-watch-collection.firebasestorage.app",
        messagingSenderId: "780300275683",
        appId: "1:780300275683:web:05a06771ac53c744e3dad6"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDocs, getDoc, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // ---------- UI Helpers ----------
    const loader = document.getElementById('globalLoader');
    function showLoader() { if(loader) loader.classList.add('active'); }
    function hideLoader() { if(loader) loader.classList.remove('active'); }
    
    function showMessage(message, type = 'info') {
        const container = document.getElementById('notificationContainer');
        if (!container) return;
        const id = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        const icons = { success: '✓', error: '✗', warning: '⚠', info: 'ℹ' };
        const notif = document.createElement('div');
        notif.id = id;
        notif.className = `notification notification-${type}`;
        notif.innerHTML = `<i>${icons[type] || 'ℹ'}</i><span>${escapeHtml(message)}</span>`;
        container.appendChild(notif);
        setTimeout(() => notif.classList.add('show'), 10);
        setTimeout(() => { notif.classList.remove('show'); setTimeout(() => notif.remove(), 300); }, 3200);
    }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    function getFriendlyError(code) {
        const map = {
            'auth/email-already-in-use': 'Email already registered. Try logging in.',
            'auth/invalid-email': 'Invalid email format.',
            'auth/weak-password': 'Password must be at least 6 characters.',
            'auth/wrong-password': 'Incorrect password.',
            'auth/user-not-found': 'No account found. Register first.',
            'auth/too-many-requests': 'Too many attempts. Try later.',
            'auth/network-request-failed': 'Check your internet connection.',
            'storage/unauthorized': 'Storage permission denied. Update Storage rules to allow write.',
            'storage/canceled': 'Upload canceled.'
        };
        return map[code] || `Error: ${code}`;
    }

    // DOM elements (same as before)
    const homeSection = document.getElementById('home-section');
    const userPanelSection = document.getElementById('user-panel-section');
    const adminPanelSection = document.getElementById('admin-panel-section');
    const registerBtn = document.getElementById('registerBtn');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userPanelNav = document.getElementById('userPanelNavBtn');
    const adminPanelNav = document.getElementById('adminPanelNavBtn');
    const homeNav = document.getElementById('homeNavBtn');
    const cartIcon = document.getElementById('cartIconBtn');
    const cartSidebar = document.getElementById('cartSidebar');
    const closeCart = document.getElementById('closeCart');
    const cartOverlay = document.getElementById('cartOverlay');
    const cartItemsDiv = document.getElementById('cartItems');
    const cartTotalSpan = document.getElementById('cartTotal');
    const cartCountSpan = document.getElementById('cartCount');
    const regModal = document.getElementById('registerModal');
    const loginModal = document.getElementById('loginModal');
    const closeReg = document.getElementById('closeRegModal');
    const closeLogin = document.getElementById('closeLoginModal');
    const regForm = document.getElementById('regForm');
    const loginForm = document.getElementById('loginForm');
    const productForm = document.getElementById('productForm');
    const productListAdmin = document.getElementById('productListAdmin');
    const userListAdmin = document.getElementById('userListAdmin');
    const perfStats = document.getElementById('performanceStats');
    const cancelEditBtn = document.getElementById('cancelEdit');
    const userInfoDiv = document.getElementById('userInfoDisplay');
    const contactEmailSpan = document.getElementById('contactEmailSpan');
    const socialContainer = document.getElementById('socialLinksContainer');
    const submitBtn = document.getElementById('submitProductBtn');

    let currentUser = null, currentUserRole = 'guest', products = [], cart = [], editingId = null;

    // ----- Cart -----
    function saveCart() { localStorage.setItem('rollingWatchCart', JSON.stringify(cart)); updateCartUI(); }
    function loadCart() { const s = localStorage.getItem('rollingWatchCart'); cart = s ? JSON.parse(s) : []; updateCartUI(); }
    function updateCartUI() {
        let total = 0, count = 0;
        cartItemsDiv.innerHTML = '';
        if (!cart.length) { cartItemsDiv.innerHTML = '<div class="text-gray-500 text-center py-6">Cart empty</div>'; }
        else {
            cart.forEach((item, idx) => {
                total += item.price * item.quantity;
                count += item.quantity;
                const div = document.createElement('div');
                div.className = 'flex gap-3 border-b pb-3 mb-3';
                div.innerHTML = `
                    <img src="${item.imageUrl || 'https://via.placeholder.com/60'}" class="w-14 h-14 object-cover rounded">
                    <div class="flex-1"><h4 class="font-semibold">${escapeHtml(item.name)}</h4><span>$${item.price}</span>
                    <div class="flex gap-2 mt-1"><button class="cart-dec bg-gray-200 px-2 rounded" data-idx="${idx}">-</button><span>${item.quantity}</span><button class="cart-inc bg-gray-200 px-2 rounded" data-idx="${idx}">+</button><button class="cart-del text-red-500 ml-1" data-idx="${idx}">🗑</button></div></div>
                    <div>$${(item.price * item.quantity).toFixed(2)}</div>`;
                cartItemsDiv.appendChild(div);
            });
        }
        cartTotalSpan.innerText = total.toFixed(2);
        cartCountSpan.innerText = count;
        document.querySelectorAll('.cart-dec').forEach(btn => btn.onclick = () => { let i = btn.dataset.idx; if(cart[i].quantity>1) cart[i].quantity--; else cart.splice(i,1); saveCart(); renderProducts(); });
        document.querySelectorAll('.cart-inc').forEach(btn => btn.onclick = () => { let i = btn.dataset.idx; cart[i].quantity++; saveCart(); renderProducts(); });
        document.querySelectorAll('.cart-del').forEach(btn => btn.onclick = () => { cart.splice(btn.dataset.idx,1); saveCart(); renderProducts(); });
    }
    function addToCart(product) {
        const exist = cart.find(i => i.id === product.id);
        exist ? exist.quantity++ : cart.push({ ...product, quantity: 1 });
        saveCart();
        showMessage(`${product.name} added to cart`, 'success');
    }

    // ----- Products with storage upload (resilient) -----
    async function fetchProducts() {
        showLoader();
        try {
            const snap = await getDocs(collection(db, "products"));
            products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderProducts();
            if (currentUserRole === 'admin') await renderAdminList();
            if (currentUserRole === 'admin') await fetchUsers();
        } catch(e) { console.error(e); showMessage('Could not load products. Check Firestore rules.', 'error'); }
        finally { hideLoader(); }
    }
    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        if (!grid) return;
        if (!products.length) { grid.innerHTML = '<div class="col-span-full text-center py-10">✨ No watches yet. Admin can add.</div>'; return; }
        grid.innerHTML = products.map(p => `
            <div class="bg-white rounded-2xl shadow-md hover:shadow-xl transition p-3">
                <img src="${p.imageUrl || 'https://via.placeholder.com/300'}" class="h-48 w-full object-cover rounded" loading="lazy">
                <h3 class="font-bold text-lg mt-2">${escapeHtml(p.name)}</h3>
                <p class="text-gray-600 text-sm">${escapeHtml(p.description?.substring(0,80) || '')}</p>
                <div class="flex justify-between mt-3"><span class="text-xl font-bold text-amber-700">$${p.price}</span>
                <button class="add-cart bg-black text-white px-3 py-1 rounded-full text-sm" data-id="${p.id}"><i class="fas fa-cart-plus mr-1"></i> Add</button></div>
            </div>
        `).join('');
        document.querySelectorAll('.add-cart').forEach(btn => btn.onclick = () => { const prod = products.find(p => p.id === btn.dataset.id); if(prod) addToCart(prod); });
    }
    async function renderAdminList() {
        if (!productListAdmin) return;
        if (!products.length) { productListAdmin.innerHTML = '<div class="text-gray-500">No products</div>'; return; }
        productListAdmin.innerHTML = products.map(p => `
            <div class="flex justify-between border-b py-2 items-center">
                <div class="flex gap-2"><img src="${p.imageUrl || 'https://via.placeholder.com/40'}" class="w-8 h-8 object-cover rounded"><div><strong>${escapeHtml(p.name)}</strong> - $${p.price}</div></div>
                <div><button class="edit-prod bg-blue-600 text-white px-2 py-1 rounded text-sm mr-1" data-id="${p.id}">Edit</button><button class="del-prod bg-red-600 text-white px-2 py-1 rounded text-sm" data-id="${p.id}">Del</button></div>
            </div>`).join('');
        document.querySelectorAll('.edit-prod').forEach(btn => btn.onclick = () => openEdit(btn.dataset.id));
        document.querySelectorAll('.del-prod').forEach(btn => btn.onclick = async () => { if(confirm('Delete product?')) await deleteProduct(btn.dataset.id); });
    }
    async function deleteProduct(id) {
        showLoader();
        try {
            const refProd = doc(db, "products", id);
            const snap = await getDoc(refProd);
            if(snap.exists() && snap.data().imageUrl) {
                const path = snap.data().imageUrl.split('/o/')[1]?.split('?')[0];
                if(path) try { await deleteObject(ref(storage, decodeURIComponent(path))); } catch(e) { console.warn('image delete failed',e); }
            }
            await deleteDoc(refProd);
            showMessage('Product deleted', 'success');
            await fetchProducts();
            if(currentUserRole === 'admin') await fetchUsers();
        } catch(e) { showMessage('Delete failed: ' + e.message, 'error'); }
        finally { hideLoader(); }
    }
    async function openEdit(id) {
        const prod = products.find(p => p.id === id);
        if(!prod) return;
        editingId = id;
        document.getElementById('productName').value = prod.name;
        document.getElementById('productDesc').value = prod.description || '';
        document.getElementById('productPrice').value = prod.price;
        document.getElementById('productFormTitle').innerText = '✏️ Update Watch';
        cancelEditBtn.classList.remove('hidden');
    }
    function resetEdit() { editingId = null; productForm.reset(); document.getElementById('productFormTitle').innerText = '➕ Add New Watch'; cancelEditBtn.classList.add('hidden'); document.getElementById('productImage').value = ''; }
    
    // Upload with Firestore storage (no gcloud, but CORS must be set via Google Cloud Console)
    async function uploadImage(file) {
        const storageRef = ref(storage, `products/${Date.now()}_${file.name.replace(/\s/g, '_')}`);
        const uploadTask = uploadBytesResumable(storageRef, file);
        return new Promise((resolve, reject) => {
            uploadTask.on('state_changed', null,
                (error) => {
                    if (error.message.includes('CORS') || error.code === 'storage/unauthorized') {
                        reject(new Error('CORS or permissions: Please configure Storage CORS (see instructions) and set rules to allow write.'));
                    } else {
                        reject(error);
                    }
                },
                async () => resolve(await getDownloadURL(uploadTask.snapshot.ref))
            );
        });
    }

    productForm.onsubmit = async (e) => {
        e.preventDefault();
        const name = document.getElementById('productName').value.trim();
        const desc = document.getElementById('productDesc').value.trim();
        const price = parseFloat(document.getElementById('productPrice').value);
        const imgFile = document.getElementById('productImage').files[0];
        if(!name || isNaN(price)) { showMessage('Name & valid price required', 'warning'); return; }
        showLoader();
        submitBtn.disabled = true;
        try {
            let imgUrl = null;
            if(editingId) {
                const existingRef = doc(db, "products", editingId);
                const existingSnap = await getDoc(existingRef);
                const oldData = existingSnap.data();
                if(imgFile) {
                    if(oldData.imageUrl) {
                        const oldPath = oldData.imageUrl.split('/o/')[1]?.split('?')[0];
                        if(oldPath) try { await deleteObject(ref(storage, decodeURIComponent(oldPath))); } catch(e) {}
                    }
                    imgUrl = await uploadImage(imgFile);
                } else imgUrl = oldData.imageUrl;
                await updateDoc(existingRef, { name, description: desc, price, imageUrl: imgUrl });
                showMessage('Product updated', 'success');
            } else {
                if(!imgFile) { showMessage('Select an image', 'warning'); return; }
                imgUrl = await uploadImage(imgFile);
                await addDoc(collection(db, "products"), { name, description: desc, price, imageUrl: imgUrl, createdAt: new Date() });
                showMessage('New product added', 'success');
            }
            resetEdit();
            await fetchProducts();
            if(currentUserRole === 'admin') await fetchUsers();
        } catch(err) {
            console.error(err);
            if(err.message.includes('CORS')) {
                showMessage('CORS error: Set Storage CORS in Google Cloud Console (bucket -> edit CORS)', 'error');
            } else {
                showMessage('Save error: ' + err.message, 'error');
            }
        } finally {
            hideLoader();
            submitBtn.disabled = false;
        }
    };
    cancelEditBtn.onclick = resetEdit;

    async function fetchUsers() {
        if(!userListAdmin) return;
        try {
            const snap = await getDocs(collection(db, "users"));
            let html = `<tr class="bg-gray-100"><th>Name</th><th>Email</th><th>Role</th></tr>`;
            snap.forEach(d => { const data = d.data(); html += `<tr><td class="py-1">${escapeHtml(data.firstName||'')} ${escapeHtml(data.lastName||'')}</td><td>${escapeHtml(data.email)}</td><td>${escapeHtml(data.role||'user')}</td></tr>`; });
            userListAdmin.innerHTML = html;
            if(perfStats) perfStats.innerHTML = `<div class="bg-white p-3 rounded shadow"><p>📊 Users: ${snap.size}</p><p>⌚ Products: ${products.length}</p><p>🛒 Cart: ${cart.reduce((a,b)=>a+b.quantity,0)}</p></div>`;
        } catch(e) { console.warn(e); }
    }

    // Auth 
    async function register(email, pwd, first, last) {
        showLoader();
        try {
            const cred = await createUserWithEmailAndPassword(auth, email, pwd);
            const role = email === 'admin@rollingwatch.com' ? 'admin' : 'user';
            await setDoc(doc(db, "users", cred.user.uid), { firstName: first, lastName: last, email, role, createdAt: new Date() });
            showMessage(`Welcome ${first}! Registration complete.`, 'success');
            closeModal(regModal);
        } catch(err) { showMessage(getFriendlyError(err.code), 'error'); }
        finally { hideLoader(); }
    }
    async function login(email, pwd) {
        showLoader();
        try { await signInWithEmailAndPassword(auth, email, pwd); showMessage('Login successful', 'success'); closeModal(loginModal); } 
        catch(err) { showMessage(getFriendlyError(err.code), 'error'); }
        finally { hideLoader(); }
    }
    function logout() { signOut(auth); showMessage('Logged out', 'info'); }

    // Navigation
    function showHome() { homeSection.classList.remove('hidden'); userPanelSection.classList.add('hidden'); adminPanelSection.classList.add('hidden'); fetchProducts(); }
    function showUser() { if(!currentUser) { showMessage('Please login first', 'warning'); return; } homeSection.classList.add('hidden'); adminPanelSection.classList.add('hidden'); userPanelSection.classList.remove('hidden'); loadProfile(); }
    function showAdmin() { if(currentUserRole !== 'admin') { showMessage('Admin access only', 'error'); return; } homeSection.classList.add('hidden'); userPanelSection.classList.add('hidden'); adminPanelSection.classList.remove('hidden'); fetchProducts(); fetchUsers(); }
    async function loadProfile() {
        if(!currentUser) return;
        try {
            const snap = await getDoc(doc(db, "users", currentUser.uid));
            if(snap.exists()) { const d = snap.data(); userInfoDiv.innerHTML = `<div class="p-4 rounded bg-white shadow"><strong>${escapeHtml(d.firstName)} ${escapeHtml(d.lastName)}</strong><br>${escapeHtml(d.email)}<br>Role: ${escapeHtml(d.role)}</div>`; contactEmailSpan.innerText = d.email; }
            else { userInfoDiv.innerHTML = '<p>Profile error</p>'; contactEmailSpan.innerText = currentUser.email; }
        } catch(e) { showMessage('Failed to load profile', 'error'); }
    }
    function updateNav() { 
        const logged = !!currentUser; 
        registerBtn.classList.toggle('hidden', logged); loginBtn.classList.toggle('hidden', logged); logoutBtn.classList.toggle('hidden', !logged);
        userPanelNav.classList.toggle('hidden', !logged); adminPanelNav.classList.toggle('hidden', currentUserRole !== 'admin');
    }
    onAuthStateChanged(auth, async (user) => { 
        currentUser = user; 
        if(user) { try { const snap = await getDoc(doc(db, "users", user.uid)); currentUserRole = snap.exists() ? snap.data().role : (user.email === 'admin@rollingwatch.com' ? 'admin' : 'user'); } catch(e) { currentUserRole = 'user'; } } 
        else { currentUserRole = 'guest'; } 
        updateNav(); 
        if(currentUserRole === 'admin') adminPanelNav.classList.remove('hidden'); 
        if(currentUser && !userPanelSection.classList.contains('hidden')) loadProfile(); 
    });

    // Event listeners
    homeNav.onclick = showHome;
    userPanelNav.onclick = showUser;
    adminPanelNav.onclick = showAdmin;
    registerBtn.onclick = () => openModal(regModal);
    loginBtn.onclick = () => openModal(loginModal);
    logoutBtn.onclick = logout;
    closeReg.onclick = () => closeModal(regModal);
    closeLogin.onclick = () => closeModal(loginModal);
    cartIcon.onclick = () => { cartSidebar.classList.remove('translate-x-full'); cartOverlay.classList.remove('hidden'); };
    closeCart.onclick = () => { cartSidebar.classList.add('translate-x-full'); cartOverlay.classList.add('hidden'); };
    cartOverlay.onclick = () => { cartSidebar.classList.add('translate-x-full'); cartOverlay.classList.add('hidden'); };
    regForm.onsubmit = (e) => { e.preventDefault(); const p = document.getElementById('regPassword').value, cp = document.getElementById('regConfirmPassword').value; if(p !== cp) { showMessage('Passwords mismatch', 'warning'); return; } register(document.getElementById('regEmail').value, p, document.getElementById('regFirstName').value, document.getElementById('regLastName').value); };
    loginForm.onsubmit = (e) => { e.preventDefault(); login(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); };
    function openModal(m) { m.classList.remove('hidden'); }
    function closeModal(m) { m.classList.add('hidden'); }
    socialContainer.innerHTML = `<a href="https://facebook.com/rollingwatch" target="_blank" class="text-blue-700 text-2xl"><i class="fab fa-facebook"></i></a> <a href="https://instagram.com/rollingwatch" target="_blank" class="text-pink-600 text-2xl"><i class="fab fa-instagram"></i></a> <a href="https://twitter.com/rollingwatch" target="_blank" class="text-sky-500 text-2xl"><i class="fab fa-twitter"></i></a>`;
    loadCart();
    fetchProducts();
    showHome();
</script>
</body>
</html>
